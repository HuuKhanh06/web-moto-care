<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <title>MOTO CARE - Chuyển hướng</title>
    <script type="text/javascript">
      // GitHub Pages SPA Single Page Application redirect
      var pathSegmentsToKeep = 1;
      var l = window.location;
      var newUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/#/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') +
        (l.search ? l.search : '');
      window.location.replace(newUrl);
    </script>
  </head>
  <body>
    <p>Đang chuyển hướng về hệ thống MOTO CARE...</p>
  </body>
</html>
